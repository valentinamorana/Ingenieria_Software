
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.login-wrap {
  display: flex;
  min-height: 520px;
  border-radius: var(--border-radius-lg);
  overflow: hidden;
  border: 0.5px solid #E8D0DF;
  background: #fff;
}
.login-left {
  width: 280px;
  flex-shrink: 0;
  background: #fff;
  padding: 2.5rem 2rem;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  overflow: hidden;
  border-right: 0.5px solid #F0E0EA;
}
.login-right {
  flex: 1;
  padding: 2.5rem 2.5rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: #FBF0F6;
  position: relative;
  overflow: hidden;
}
.login-right::before {
  content: '';
  position: absolute;
  top: -80px; right: -80px;
  width: 220px; height: 220px;
  border-radius: 50%;
  background: rgba(123,34,82,0.06);
}
.login-right::after {
  content: '';
  position: absolute;
  bottom: -60px; left: -40px;
  width: 180px; height: 180px;
  border-radius: 50%;
  background: rgba(123,34,82,0.05);
}
.brand-logo { display: flex; align-items: center; gap: 8px; z-index: 2; }
.brand-logo-icon {
  width: 34px; height: 34px;
  background: #7B2252;
  border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
}
.brand-logo-icon i { font-size: 17px; color: #fff; }
.brand-name { font-size: 14px; font-weight: 500; color: #2C1A24; }
.brand-body { z-index: 2; }
.brand-sub {
  font-size: 10.5px; font-weight: 500;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: #C9A0BA; margin-bottom: 10px;
}
.brand-wordmark {
  font-size: 28px;
  font-weight: 500;
  color: #2C1A24;
  line-height: 1.2;
  margin-bottom: 6px;
  letter-spacing: -0.01em;
}
.brand-wordmark span { color: #7B2252; }
.brand-desc { font-size: 12.5px; color: #A08898; line-height: 1.6; }
.lang-pills { display: flex; gap: 6px; z-index: 2; }
.lang-pill {
  font-size: 11px; padding: 4px 10px;
  border-radius: 20px; border: 0.5px solid #E0C8D8;
  color: #B08898; cursor: pointer; background: transparent;
}
.lang-pill.active { background: #F3EAF0; color: #7B2252; border-color: #C9A0BA; }
.form-wrap { position: relative; z-index: 2; }
.login-title { font-size: 22px; font-weight: 500; color: #2C1A24; margin-bottom: 4px; }
.login-subtitle { font-size: 13px; color: #A08898; margin-bottom: 2rem; }
.field { margin-bottom: 1.1rem; }
.field label {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 500;
  letter-spacing: 0.07em; text-transform: uppercase;
  color: #A08898; margin-bottom: 6px;
}
.field label i { font-size: 12px; }
.field-wrap { position: relative; }
.field input {
  width: 100%; height: 42px; padding: 0 14px;
  border-radius: 10px;
  border: 1px solid #E8D0DF;
  background: #fff;
  font-size: 14px; color: #2C1A24; outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.field input:focus {
  border-color: #7B2252;
  box-shadow: 0 0 0 3px rgba(123,34,82,0.09);
}
.eye-btn {
  position: absolute; right: 12px; top: 50%;
  transform: translateY(-50%);
  background: none; border: none; cursor: pointer;
  color: #C0A8B8; font-size: 16px; padding: 0;
}
.eye-btn:hover { color: #7B2252; }
.forgot { text-align: right; margin-top: 6px; }
.forgot a { font-size: 12px; color: #7B2252; text-decoration: none; opacity: 0.8; }
.forgot a:hover { opacity: 1; text-decoration: underline; }
.btn-primary {
  width: 100%; height: 44px; margin-top: 1.5rem;
  background: #7B2252; color: #fff;
  border: none; border-radius: 10px;
  font-size: 14px; font-weight: 500; letter-spacing: 0.04em;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: opacity 0.15s;
}
.btn-primary:hover { opacity: 0.87; }
.btn-primary i { font-size: 16px; }
.divider { display: flex; align-items: center; gap: 12px; margin: 1.25rem 0; }
.divider hr { flex: 1; border: none; border-top: 0.5px solid #E8D0DF; }
.divider span { font-size: 11px; color: #C0A8B8; text-transform: uppercase; letter-spacing: 0.06em; }
.btn-secondary {
  width: 100%; height: 40px;
  background: #fff; border: 0.5px solid #E0C8D8;
  border-radius: 10px; font-size: 13px; color: #A08898;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background 0.15s;
}
.btn-secondary:hover { background: #F8EDF4; }
.btn-secondary i { font-size: 16px; }
</style>
